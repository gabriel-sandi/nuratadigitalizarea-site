name: Restaurare cursuri Moodle (temporar)

# Urcă cele 3 copii de rezervă (.mbz) pe academie, le restaurează printr-un script
# temporar protejat cu o cheie unică generată la fiecare rulare, apoi șterge scriptul
# și fișierele. Cursurile existente cu același nume scurt nu sunt atinse.

on:
  push:
    branches: [claude/project-thread-3lbc5y]
    paths: ['moodle-restore/**', '.github/workflows/moodle-restore.yml']

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

permissions:
  contents: read

env:
  REMOTE_BASE: public_html/nuratadigitalizarea.ro
  SITE: https://academie.nuratadigitalizarea.ro

jobs:
  restore:
    if: ${{ hashFiles('moodle-restore/nrd-restore.php') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Instalez lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Pregătesc scriptul cu o cheie unică
        run: |
          TOKEN=$(openssl rand -hex 24); NAME="nrd-restore-$(openssl rand -hex 8).php"
          echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"; echo "NAME=$NAME" >> "$GITHUB_ENV"
          sed "s/__TOKEN__/$TOKEN/" moodle-restore/nrd-restore.php > "$RUNNER_TEMP/$NAME"
      - name: Urc, restaurez, șterg
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DEPLOY_PROTOCOL: ${{ vars.DEPLOY_PROTOCOL }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          proto="${DEPLOY_PROTOCOL:-sftp}"
          if [ "$proto" = "ftps" ]; then url="ftp://$FTP_HOST:${DEPLOY_PORT:-21}"; else url="sftp://$FTP_HOST:${DEPLOY_PORT:-22}"; fi
          common="set net:max-retries 3; set net:timeout 30; set sftp:auto-confirm yes; set ftp:ssl-force true; set ftp:ssl-protect-data true; open --env-password -u \"$FTP_USER\" $url"
          export LFTP_PASSWORD="$FTP_PASSWORD"
          cleanup() { lftp -c "$common; cd $REMOTE_BASE/academie; rm -f $NAME; rm -rf nrd-restore-files" || true; }
          trap cleanup EXIT
          lftp -c "set cmd:fail-exit yes; $common; cd $REMOTE_BASE/academie; cls config.php; mkdir -f -p nrd-restore-files; put $RUNNER_TEMP/$NAME -o $NAME; mput -O nrd-restore-files moodle-restore/*.mbz"
          ok=1
          for f in curs-ia-intro-moodle45.mbz curs-ia-contracte-moodle45.mbz curs-ia-alegere-moodle45.mbz; do
            r=$(curl -sS --max-time 600 "$SITE/$NAME?k=$TOKEN&f=$f" || true)
            echo "$f -> $r"
            echo "$r" | grep -Eq '"stare":"(restaurat|exista deja)"' || ok=0
          done
          [ $ok = 1 ] || { echo "::error::Cel puțin un curs nu s-a restaurat"; exit 1; }
